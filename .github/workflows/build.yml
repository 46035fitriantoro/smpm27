name: Build Flutter SDM49 APK & AAB

on:
  push:
    branches: [ sdm49 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Rename APK & AAB
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk sdm49.apk
          cp build/app/outputs/bundle/release/app-release.aab sdm49.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sdm49-apk
          path: sdm49.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: sdm49-aab
          path: sdm49.aab
