name: Build Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Build AppBundle
        run: flutter build appbundle --release

      - name: Rename APK
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/SMPM-27.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMPM27-APK
          path: build/app/outputs/flutter-apk/SMPM-27.apk

      - name: Rename AAB
        shell: bash
        run: |
          cp build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/SMPM-27.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: SMPM27-AAB
          path: build/app/outputs/bundle/release/SMPM-27.aab
